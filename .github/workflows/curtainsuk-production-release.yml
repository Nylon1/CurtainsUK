name: CurtainsUK protected release validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curtainsuk-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/release/production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - name: Install and compare with recorded production source
        run: |
          npm ci --ignore-scripts --no-audit
          BASE=$(node -p "require('./release/baseline.json').reconstructedSourceCommit")
          git worktree add "$RUNNER_TEMP/production-baseline" "$BASE"
          npm ci --ignore-scripts --no-audit --prefix "$RUNNER_TEMP/production-baseline"
          node release/gate.mjs . "$RUNNER_TEMP/production-baseline"
      - name: Advisory live smoke
        continue-on-error: true
        run: node release/live-smoke.mjs
      - name: Confirm manual release eligibility
        run: |
          echo "Protected validation passed for $GITHUB_SHA."
          echo "Owner-authorised manual Vercel deployment is permitted only from this exact release/production HEAD."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-release-${{ github.sha }}
          path: artifacts/production-gate/
