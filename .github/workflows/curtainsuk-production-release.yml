name: CurtainsUK controlled production release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curtainsuk-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/release/production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: curtainsuk-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - name: Install and compare with recorded production source
        run: |
          npm ci --ignore-scripts --no-audit
          BASE=$(node -p "require('./release/baseline.json').reconstructedSourceCommit")
          git worktree add "$RUNNER_TEMP/production-baseline" "$BASE"
          npm ci --ignore-scripts --no-audit --prefix "$RUNNER_TEMP/production-baseline"
          node release/gate.mjs . "$RUNNER_TEMP/production-baseline"
      - name: Current production health must pass before any deployment
        run: node release/live-smoke.mjs
      - name: Fail closed on incomplete bootstrap, permissions, or capability proof
        env:
          CURTAINSUK_DEPLOYMENT_PERMISSIONS_VERIFIED: ${{ vars.CURTAINSUK_DEPLOYMENT_PERMISSIONS_VERIFIED }}
        run: node release/preflight.mjs
      - name: Deployment activation remains blocked pending owner review
        run: |
          echo 'BLOCKED: isolated CI production credential, candidate-runtime probes and atomic baseline writer must be configured and reviewed before activation.'
          exit 1
      # Deliberately no deploy command or Production secret until the above boundary
      # is enforceable. A placeholder health result must never enable deployment.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-release-${{ github.sha }}
          path: artifacts/production-gate/
