name: Fabric visual analysis asset proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-visual-analysis-asset-proof-production
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prove current CDN analysis assets without inference or writes
        run: npx --no-install tsx scripts/curtainsuk-visual-analysis-asset-proof.ts --out=artifacts/visual-analysis-assets --concurrency=16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-visual-analysis-asset-proof
          path: artifacts/visual-analysis-assets/

