name: Fabric visual ledger proof

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "plan, full, offline artifact-only, or partial patch pilot"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - full
          - artifact-only
          - partial-pilot
      scope_mode:
        description: "catalogue scope"
        required: true
        default: "target-missing"
        type: choice
        options:
          - target-missing
          - full-catalogue
          - explicit-cohort
      fabric_ids_json:
        description: "Exact fabric IDs as JSON; required for explicit-cohort (1–500)"
        required: false
        default: "[]"
        type: string
      target_seed_run_id:
        description: "target run whose design evidence should be resumed"
        required: false
        default: "5f766a83-3726-4e5e-ace0-a6861b49f162"
        type: string
      design_concurrency:
        description: "Independent design analyses in flight (1–3; database persistence remains serialized)"
        required: false
        default: "1"
        type: string
  push:
    branches:
      - stock/pt-webtex-production
    paths:
      - ".github/workflows/fabric-visual-ledger-proof.yml"
      - "scripts/curtainsuk-visual-enrichment.ts"
      - "scripts/curtainsuk-visual-ledger-proof.ts"
      - "lib/fabric-master/visual-enrichment.ts"
      - "lib/supabase/supplier-service.ts"
      - "supabase/migrations/20260919094500_optimised_fabric_visual_fingerprints.sql"
      - "supabase/migrations/20260919095500_visual_analysis_asset_provenance.sql"

permissions:
  contents: read

concurrency:
  group: fabric-visual-enrichment-production
  cancel-in-progress: false

jobs:
  plan:
    if: inputs.run_mode != 'artifact-only' && inputs.run_mode != 'partial-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prove Fabric Master visual ledger checkpoint path without inference
        if: inputs.scope_mode != 'explicit-cohort'
        run: npx --no-install tsx scripts/curtainsuk-visual-ledger-proof.ts
      - name: Prove optimised visual execution plan without inference
        env:
          COHORT_IDS: ${{ inputs.fabric_ids_json }}
          SCOPE_MODE: ${{ inputs.scope_mode }}
          SEED_RUN: ${{ inputs.target_seed_run_id }}
          DESIGN_CONCURRENCY: ${{ inputs.design_concurrency || '1' }}
        run: |
          ARGS=()
          if [ "$SCOPE_MODE" = "explicit-cohort" ]; then
            node -e 'require("fs").writeFileSync("/tmp/fabric-cohort.json", JSON.stringify(JSON.parse(process.env.COHORT_IDS)))'
            ARGS+=(--fabric-ids-file=/tmp/fabric-cohort.json --include-prepared)
          elif [ "$SCOPE_MODE" = "target-missing" ]; then
            ARGS+=(--target-missing "--target-seed-run-id=$SEED_RUN")
          fi
          npm run fabric:visual-enrichment -- --plan-only "${ARGS[@]}" "--design-concurrency=$DESIGN_CONCURRENCY" --out=artifacts/visual-enrichment-plan
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-visual-enrichment-plan
          path: artifacts/visual-enrichment-plan/visual-enrichment-optimised-plan.json

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run optimised Fabric Master visual enrichment
        env:
          COHORT_IDS: ${{ inputs.fabric_ids_json }}
          SCOPE_MODE: ${{ inputs.scope_mode }}
          SEED_RUN: ${{ inputs.target_seed_run_id }}
          DESIGN_CONCURRENCY: ${{ inputs.design_concurrency || '1' }}
        run: |
          ARGS=()
          if [ "$SCOPE_MODE" = "explicit-cohort" ]; then
            node -e 'require("fs").writeFileSync("/tmp/fabric-cohort.json", JSON.stringify(JSON.parse(process.env.COHORT_IDS)))'
            ARGS+=(--fabric-ids-file=/tmp/fabric-cohort.json --include-prepared)
          elif [ "$SCOPE_MODE" = "target-missing" ]; then
            ARGS+=(--target-missing "--target-seed-run-id=$SEED_RUN")
          fi
          npm run fabric:visual-enrichment -- --apply "${ARGS[@]}" "--design-concurrency=$DESIGN_CONCURRENCY" --batch-size=10 --out=artifacts/visual-enrichment-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-visual-enrichment-run
          path: artifacts/visual-enrichment-run/

  artifact-only:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'artifact-only' && inputs.scope_mode == 'explicit-cohort'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Record exact 11-fabric selection before inference
        env:
          COHORT_IDS: ${{ inputs.fabric_ids_json }}
        run: |
          mkdir -p artifacts/fabric-hybrid-artifact-only
          node -e 'const fs=require("fs"); const ids=JSON.parse(process.env.COHORT_IDS); if(!Array.isArray(ids)||ids.length!==11||new Set(ids).size!==11||ids.some(id=>typeof id!=="string"||!/^sdg-[a-z0-9-]+$/.test(id))) throw Error("EXACT_11_IDS_REQUIRED"); fs.writeFileSync("/tmp/fabric-hybrid-cohort.json",JSON.stringify(ids)); fs.writeFileSync("artifacts/fabric-hybrid-artifact-only/selection.json",JSON.stringify({fabric_ids:ids,recorded_before_inference:true},null,2));'
      - name: Run offline hybrid analysis without database writes
        run: npm run fabric:visual-enrichment -- --artifact-only --fabric-ids-file=/tmp/fabric-hybrid-cohort.json --out=artifacts/fabric-hybrid-artifact-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-hybrid-artifact-only
          path: artifacts/fabric-hybrid-artifact-only/

  partial-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'partial-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Record exact partial pilot selection before inference
        run: |
          mkdir -p artifacts/partial-hybrid-pilot
          node -e 'const fs=require("fs"); const path="scripts/fixtures/curtainsuk-partial-hybrid-pilot-selection.json"; const x=JSON.parse(fs.readFileSync(path,"utf8")); const a=x.pilot_a.flatMap(g=>g.affected_fabric_ids),b=x.pilot_b.flatMap(g=>g.affected_fabric_ids),all=[...a,...b]; if(x.recorded_before_inference!==true||x.pilot_a.length!==36||x.pilot_b.length!==10||a.length!==149||b.length!==30||new Set(all).size!==179||x.model!=="gpt-5.6-terra"||x.reasoning!=="medium")throw Error("PARTIAL_PILOT_SELECTION_REJECTED"); fs.copyFileSync(path,"artifacts/partial-hybrid-pilot/selection.json");'
      - name: Run read-only patch-only hybrid pilot
        run: npx --no-install tsx scripts/curtainsuk-partial-hybrid-pilot.ts --selection=scripts/fixtures/curtainsuk-partial-hybrid-pilot-selection.json --out=artifacts/partial-hybrid-pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-hybrid-patch-only-pilot
          path: artifacts/partial-hybrid-pilot/
