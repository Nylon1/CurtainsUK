name: Fabric visual ledger proof

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "plan, full, offline artifact-only, or partial patch pilot"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - full
          - artifact-only
          - partial-pilot
          - partial-contract-retest
          - partial-pilot-closure
          - partial-scale
          - partial-manifest
          - import-rehearsal-snapshot
      scope_mode:
        description: "catalogue scope"
        required: true
        default: "target-missing"
        type: choice
        options:
          - target-missing
          - full-catalogue
          - explicit-cohort
      fabric_ids_json:
        description: "Exact fabric IDs as JSON; required for explicit-cohort (1–500)"
        required: false
        default: "[]"
        type: string
      target_seed_run_id:
        description: "target run whose design evidence should be resumed"
        required: false
        default: "5f766a83-3726-4e5e-ace0-a6861b49f162"
        type: string
      design_concurrency:
        description: "Independent design analyses in flight (1–3; database persistence remains serialized)"
        required: false
        default: "1"
        type: string
      artifact_sources_json:
        description: "Accepted partial patch run/artifact identities for offline manifest consolidation"
        required: false
        default: "[]"
        type: string
  push:
    branches:
      - stock/pt-webtex-production
    paths:
      - ".github/workflows/fabric-visual-ledger-proof.yml"
      - "scripts/curtainsuk-visual-enrichment.ts"
      - "scripts/curtainsuk-visual-ledger-proof.ts"
      - "lib/fabric-master/visual-enrichment.ts"
      - "lib/supabase/supplier-service.ts"
      - "supabase/migrations/20260919094500_optimised_fabric_visual_fingerprints.sql"
      - "supabase/migrations/20260919095500_visual_analysis_asset_provenance.sql"

permissions:
  contents: read
  actions: read

concurrency:
  group: fabric-visual-enrichment-production
  cancel-in-progress: false

jobs:
  import-rehearsal-snapshot:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'import-rehearsal-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only governed snapshot
        run: node scripts/curtainsuk-import-rehearsal-snapshot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-rehearsal-readonly-snapshot
          path: artifacts/import-rehearsal-snapshot/

  plan:
    if: inputs.run_mode != 'artifact-only' && inputs.run_mode != 'partial-pilot' && inputs.run_mode != 'partial-contract-retest' && inputs.run_mode != 'partial-pilot-closure' && inputs.run_mode != 'partial-scale' && inputs.run_mode != 'partial-manifest' && inputs.run_mode != 'import-rehearsal-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prove Fabric Master visual ledger checkpoint path without inference
        if: inputs.scope_mode != 'explicit-cohort'
        run: npx --no-install tsx scripts/curtainsuk-visual-ledger-proof.ts
      - name: Prove optimised visual execution plan without inference
        env:
          COHORT_IDS: ${{ inputs.fabric_ids_json }}
          SCOPE_MODE: ${{ inputs.scope_mode }}
          SEED_RUN: ${{ inputs.target_seed_run_id }}
          DESIGN_CONCURRENCY: ${{ inputs.design_concurrency || '1' }}
        run: |
          ARGS=()
          if [ "$SCOPE_MODE" = "explicit-cohort" ]; then
            node -e 'require("fs").writeFileSync("/tmp/fabric-cohort.json", JSON.stringify(JSON.parse(process.env.COHORT_IDS)))'
            ARGS+=(--fabric-ids-file=/tmp/fabric-cohort.json --include-prepared)
          elif [ "$SCOPE_MODE" = "target-missing" ]; then
            ARGS+=(--target-missing "--target-seed-run-id=$SEED_RUN")
          fi
          npm run fabric:visual-enrichment -- --plan-only "${ARGS[@]}" "--design-concurrency=$DESIGN_CONCURRENCY" --out=artifacts/visual-enrichment-plan
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-visual-enrichment-plan
          path: artifacts/visual-enrichment-plan/visual-enrichment-optimised-plan.json

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run optimised Fabric Master visual enrichment
        env:
          COHORT_IDS: ${{ inputs.fabric_ids_json }}
          SCOPE_MODE: ${{ inputs.scope_mode }}
          SEED_RUN: ${{ inputs.target_seed_run_id }}
          DESIGN_CONCURRENCY: ${{ inputs.design_concurrency || '1' }}
        run: |
          ARGS=()
          if [ "$SCOPE_MODE" = "explicit-cohort" ]; then
            node -e 'require("fs").writeFileSync("/tmp/fabric-cohort.json", JSON.stringify(JSON.parse(process.env.COHORT_IDS)))'
            ARGS+=(--fabric-ids-file=/tmp/fabric-cohort.json --include-prepared)
          elif [ "$SCOPE_MODE" = "target-missing" ]; then
            ARGS+=(--target-missing "--target-seed-run-id=$SEED_RUN")
          fi
          npm run fabric:visual-enrichment -- --apply "${ARGS[@]}" "--design-concurrency=$DESIGN_CONCURRENCY" --batch-size=10 --out=artifacts/visual-enrichment-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-visual-enrichment-run
          path: artifacts/visual-enrichment-run/

  artifact-only:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'artifact-only' && inputs.scope_mode == 'explicit-cohort'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Record exact 11-fabric selection before inference
        env:
          COHORT_IDS: ${{ inputs.fabric_ids_json }}
        run: |
          mkdir -p artifacts/fabric-hybrid-artifact-only
          node -e 'const fs=require("fs"); const ids=JSON.parse(process.env.COHORT_IDS); if(!Array.isArray(ids)||ids.length!==11||new Set(ids).size!==11||ids.some(id=>typeof id!=="string"||!/^sdg-[a-z0-9-]+$/.test(id))) throw Error("EXACT_11_IDS_REQUIRED"); fs.writeFileSync("/tmp/fabric-hybrid-cohort.json",JSON.stringify(ids)); fs.writeFileSync("artifacts/fabric-hybrid-artifact-only/selection.json",JSON.stringify({fabric_ids:ids,recorded_before_inference:true},null,2));'
      - name: Run offline hybrid analysis without database writes
        run: npm run fabric:visual-enrichment -- --artifact-only --fabric-ids-file=/tmp/fabric-hybrid-cohort.json --out=artifacts/fabric-hybrid-artifact-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-hybrid-artifact-only
          path: artifacts/fabric-hybrid-artifact-only/

  partial-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'partial-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Record exact partial pilot selection before inference
        run: |
          mkdir -p artifacts/partial-hybrid-pilot
          node -e 'const fs=require("fs"); const path="scripts/fixtures/curtainsuk-partial-hybrid-pilot-selection.json"; const x=JSON.parse(fs.readFileSync(path,"utf8")); const a=x.pilot_a.flatMap(g=>g.affected_fabric_ids),b=x.pilot_b.flatMap(g=>g.affected_fabric_ids),all=[...a,...b]; if(x.recorded_before_inference!==true||x.pilot_a.length!==36||x.pilot_b.length!==10||a.length!==149||b.length!==30||new Set(all).size!==179||x.model!=="gpt-5.6-terra"||x.reasoning!=="medium")throw Error("PARTIAL_PILOT_SELECTION_REJECTED"); fs.copyFileSync(path,"artifacts/partial-hybrid-pilot/selection.json");'
      - name: Run read-only patch-only hybrid pilot
        run: npx --no-install tsx scripts/curtainsuk-partial-hybrid-pilot.ts --selection=scripts/fixtures/curtainsuk-partial-hybrid-pilot-selection.json --out=artifacts/partial-hybrid-pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-hybrid-patch-only-pilot
          path: artifacts/partial-hybrid-pilot/

  partial-contract-retest:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'partial-contract-retest'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify and record eight previously rejected groups before inference
        run: |
          mkdir -p artifacts/partial-hybrid-contract-retest
          node -e 'const fs=require("fs"); const p="scripts/fixtures/curtainsuk-partial-hybrid-contract-retest-selection.json"; const x=JSON.parse(fs.readFileSync(p,"utf8")); const groups=[...x.pilot_a,...x.pilot_b], ids=groups.flatMap(g=>g.affected_fabric_ids); if(x.selection_version!=="partial-hybrid-contract-retest-v1"||x.source_pilot_run!==36916774493||x.source_pilot_artifact_id!==11189959573||x.recorded_before_inference!==true||x.expected_openai_requests!==8||x.pilot_a.length!==4||x.pilot_b.length!==4||new Set(ids).size!==ids.length||x.model!=="gpt-5.6-terra"||x.reasoning!=="medium")throw Error("CONTRACT_RETEST_SELECTION_REJECTED"); fs.copyFileSync(p,"artifacts/partial-hybrid-contract-retest/selection.json");'
      - name: Test patch contract offline
        run: npx --no-install tsx --test scripts/__tests__/curtainsuk-partial-hybrid-pilot.test.ts
      - name: Run bounded read-only patch contract retest
        run: npx --no-install tsx scripts/curtainsuk-partial-hybrid-pilot.ts --selection=scripts/fixtures/curtainsuk-partial-hybrid-contract-retest-selection.json --out=artifacts/partial-hybrid-contract-retest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-hybrid-contract-retest
          path: artifacts/partial-hybrid-contract-retest/

  partial-pilot-closure:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'partial-pilot-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify and record twenty remaining rejected groups before inference
        run: |
          mkdir -p artifacts/partial-hybrid-pilot-closure
          node -e 'const fs=require("fs"); const p="scripts/fixtures/curtainsuk-partial-hybrid-pilot-closure-selection.json"; const x=JSON.parse(fs.readFileSync(p,"utf8")); const groups=[...x.pilot_a,...x.pilot_b],ids=groups.flatMap(g=>g.affected_fabric_ids); if(x.selection_version!=="partial-hybrid-pilot-closure-v1"||x.source_pilot_run!==36916774493||x.exclude_retest_run!==36920035452||x.recorded_before_inference!==true||x.expected_openai_requests!==20||x.pilot_a.length!==15||x.pilot_b.length!==5||ids.length!==62||new Set(ids).size!==62||x.model!=="gpt-5.6-terra"||x.reasoning!=="medium")throw Error("PILOT_CLOSURE_SELECTION_REJECTED"); fs.copyFileSync(p,"artifacts/partial-hybrid-pilot-closure/selection.json");'
      - name: Test patch contract offline
        run: npx --no-install tsx --test scripts/__tests__/curtainsuk-partial-hybrid-pilot.test.ts
      - name: Close only the remaining rejected pilot groups
        run: npx --no-install tsx scripts/curtainsuk-partial-hybrid-pilot.ts --selection=scripts/fixtures/curtainsuk-partial-hybrid-pilot-closure-selection.json --out=artifacts/partial-hybrid-pilot-closure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-hybrid-pilot-closure
          path: artifacts/partial-hybrid-pilot-closure/

  partial-scale:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'partial-scale'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Record exact audited scale selection before inference
        run: |
          mkdir -p artifacts/partial-hybrid-scale
          node -e 'const fs=require("fs"); const p="scripts/fixtures/curtainsuk-partial-hybrid-scale-batch.json"; const x=JSON.parse(fs.readFileSync(p,"utf8")); const groups=[...x.pilot_a,...x.pilot_b],ids=groups.flatMap(g=>[...g.affected_fabric_ids,...Object.keys(g.design_only_reuse_targets_by_fabric??{})]); if(x.selection_version!=="partial-hybrid-scale-batch-v1"||x.recorded_before_inference!==true||!(["design","colourway"].includes(x.selection_kind))||(x.selection_kind==="design"?x.pilot_b.length!==0:x.pilot_a.length!==0)||groups.length!==x.expected_openai_requests||groups.length<1||groups.length>500||x.batch_size<groups.length||ids.length!==x.expected_fabric_count||new Set(ids).size!==ids.length||groups.some(g=>g.affected_fabric_ids.length<1||(x.selection_kind==="colourway"&&g.affected_fabric_ids.length>4))||groups.some(g=>[...Object.entries(g.requested_missing_fields_by_fabric),...Object.entries(g.design_only_reuse_targets_by_fabric??{})].some(([id,fields])=>fields.some(field=>(x.accepted_fields_by_fabric?.[id]??[]).includes(field))))||x.model!=="gpt-5.6-terra"||x.reasoning!=="medium"||x.max_inference_concurrency!==3)throw Error("SCALE_SELECTION_REJECTED"); fs.copyFileSync(p,"artifacts/partial-hybrid-scale/selection.json");'
      - name: Test patch contract offline
        run: npx --no-install tsx --test scripts/__tests__/curtainsuk-partial-hybrid-pilot.test.ts
      - name: Test accepted shared-design source handling offline
        run: python3 scripts/__tests__/test_curtainsuk_partial_hybrid_seed_source.py
      - name: Fetch accepted shared design source when required
        run: python3 scripts/curtainsuk-partial-hybrid-download-design-source.py --selection=scripts/fixtures/curtainsuk-partial-hybrid-scale-batch.json --out=artifacts/partial-hybrid-design-source
      - name: Run offline patch-only partial scale batch
        run: npx --no-install tsx scripts/curtainsuk-partial-hybrid-pilot.ts --selection=scripts/fixtures/curtainsuk-partial-hybrid-scale-batch.json --out=artifacts/partial-hybrid-scale --reuse-dir=artifacts/partial-hybrid-design-source
      - name: Reconcile offline patches and raw responses
        run: python3 scripts/curtainsuk-partial-hybrid-verify-batch.py --artifact=artifacts/partial-hybrid-scale
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-hybrid-scale-batch
          path: artifacts/partial-hybrid-scale/

  partial-manifest:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'partial-manifest'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_SOURCES_JSON: ${{ inputs.artifact_sources_json }}
    steps:
      - uses: actions/checkout@v4
      - name: Record exact accepted artifact sources
        run: |
          mkdir -p artifacts/partial-hybrid-master
          python3 -c 'import json,os,pathlib; sources=json.loads(os.environ["ARTIFACT_SOURCES_JSON"]); assert isinstance(sources,list) and 1<=len(sources)<=30; pathlib.Path("artifacts/partial-hybrid-master/input-sources.json").write_text(json.dumps(sources,indent=2)+"\n")'
      - name: Build cumulative read-only offline manifest
        run: python3 scripts/curtainsuk-partial-hybrid-download-manifest.py --sources-json=artifacts/partial-hybrid-master/input-sources.json --audit=scripts/fixtures/curtainsuk-partial-hybrid-audit-records.json --out=artifacts/partial-hybrid-master/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-hybrid-master-manifest
          path: |
            artifacts/partial-hybrid-master/manifest.json
            artifacts/partial-hybrid-master/sources.json
            artifacts/partial-hybrid-master/input-sources.json
