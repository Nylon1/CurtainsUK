name: Fabric visual ledger proof

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "plan or full"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - full
      scope_mode:
        description: "catalogue scope"
        required: true
        default: "target-missing"
        type: choice
        options:
          - target-missing
          - full-catalogue
          - explicit-cohort
      fabric_ids_json:
        description: "Exact fabric IDs as JSON; required for explicit-cohort (1–500)"
        required: false
        default: "[]"
        type: string
      target_seed_run_id:
        description: "target run whose design evidence should be resumed"
        required: false
        default: "5f766a83-3726-4e5e-ace0-a6861b49f162"
        type: string
  push:
    branches:
      - stock/pt-webtex-production
    paths:
      - ".github/workflows/fabric-visual-ledger-proof.yml"
      - "scripts/curtainsuk-visual-enrichment.ts"
      - "scripts/curtainsuk-visual-ledger-proof.ts"
      - "lib/fabric-master/visual-enrichment.ts"
      - "lib/supabase/supplier-service.ts"
      - "supabase/migrations/20260919094500_optimised_fabric_visual_fingerprints.sql"
      - "supabase/migrations/20260919095500_visual_analysis_asset_provenance.sql"

permissions:
  contents: read

concurrency:
  group: fabric-visual-enrichment-production
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prove Fabric Master visual ledger checkpoint path without inference
        run: npx --no-install tsx scripts/curtainsuk-visual-ledger-proof.ts
      - name: Prove optimised visual execution plan without inference
        env:
          COHORT_IDS: ${{ inputs.fabric_ids_json }}
          SCOPE_MODE: ${{ inputs.scope_mode }}
          SEED_RUN: ${{ inputs.target_seed_run_id }}
        run: |
          ARGS=()
          if [ "$SCOPE_MODE" = "explicit-cohort" ]; then
            node -e 'require("fs").writeFileSync("/tmp/fabric-cohort.json", JSON.stringify(JSON.parse(process.env.COHORT_IDS)))'
            ARGS+=(--fabric-ids-file=/tmp/fabric-cohort.json --include-prepared)
          elif [ "$SCOPE_MODE" = "target-missing" ]; then
            ARGS+=(--target-missing "--target-seed-run-id=$SEED_RUN")
          fi
          npm run fabric:visual-enrichment -- --plan-only "${ARGS[@]}" --out=artifacts/visual-enrichment-plan
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-visual-enrichment-plan
          path: artifacts/visual-enrichment-plan/visual-enrichment-optimised-plan.json

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run optimised Fabric Master visual enrichment
        env:
          COHORT_IDS: ${{ inputs.fabric_ids_json }}
          SCOPE_MODE: ${{ inputs.scope_mode }}
          SEED_RUN: ${{ inputs.target_seed_run_id }}
        run: |
          ARGS=()
          if [ "$SCOPE_MODE" = "explicit-cohort" ]; then
            node -e 'require("fs").writeFileSync("/tmp/fabric-cohort.json", JSON.stringify(JSON.parse(process.env.COHORT_IDS)))'
            ARGS+=(--fabric-ids-file=/tmp/fabric-cohort.json --include-prepared)
          elif [ "$SCOPE_MODE" = "target-missing" ]; then
            ARGS+=(--target-missing "--target-seed-run-id=$SEED_RUN")
          fi
          npm run fabric:visual-enrichment -- --apply "${ARGS[@]}" --batch-size=10 --out=artifacts/visual-enrichment-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-visual-enrichment-run
          path: artifacts/visual-enrichment-run/
