name: HCI catalogue export branch

on:
  push:
    branches:
      - fix/hci-price-level-scaling

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDG_STOCK_SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SDG_STOCK_SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Export governed HCI catalogue projection
        run: node scripts/export-hci-catalogue-snapshot.mjs artifacts/hci-catalogue-export/source.json
      - uses: actions/upload-artifact@v4
        with:
          name: hci-catalogue-source
          path: artifacts/hci-catalogue-export/source.json
          if-no-files-found: error
          retention-days: 1
