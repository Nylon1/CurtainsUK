name: Hotel Design Studio contracts
on:
  pull_request:
    branches: [release/production]
    paths:
      - 'lib/hotel-studio/**'
      - 'app/hotel-design-studio-preview/**'
      - 'app/api/staging/shopify-proxy/hotel-studio/**'
      - 'scripts/hotel-studio-preview.ts'
      - 'package*.json'
      - 'next.config.ts'
      - '.github/workflows/hotel-studio.yml'
permissions:
  contents: read
jobs:
  contracts:
    name: hotel-studio-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run test:hotel
