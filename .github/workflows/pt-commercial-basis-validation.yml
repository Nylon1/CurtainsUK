name: PT commercial basis validation

on:
  push:
    branches:
      - "validate/pt-cut-price-primary-20261002"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: PT price-basis regressions
        run: npx --no-install tsx --test lib/fabric-master/__tests__/prestigious-standard-price.test.ts lib/fabric-master/__tests__/browse-price-guide.test.ts
      - name: Storefront tests
        run: npm run test:storefront
      - name: TypeScript
        run: npx tsc --noEmit
