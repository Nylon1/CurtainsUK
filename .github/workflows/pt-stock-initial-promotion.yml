name: PT initial stock promotion

on:
  push:
    branches: [stock/pt-webtex-production]
    paths: [.github/workflows/pt-stock-initial-promotion.yml]

permissions:
  contents: read

concurrency:
  group: pt-supplier-stock-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      PT_WEBTEX_USERNAME: ${{ secrets.PT_WEBTEX_USERNAME }}
      PT_WEBTEX_PASSWORD: ${{ secrets.PT_WEBTEX_PASSWORD }}
      PT_FORCE_REFRESH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Fresh PT retrieval and exact governed materialisation
        run: npx --no-install tsx scripts/curtainsuk-pt-routine-stock.ts
      - name: Mark failed stage for operational attention
        if: failure()
        run: echo "::error title=PT initial stock promotion failed::Inspect the failed stage. No previous observation is re-dated."
