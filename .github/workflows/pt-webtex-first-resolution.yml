name: PT Webtex-first resolution

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only gate audit or governed apply"
        required: true
        default: "audit"
        type: choice
        options:
          - audit

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Reconcile unresolved Webtex records against governed gates
        run: npx --no-install tsx scripts/curtainsuk-pt-webtex-first-audit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: pt-webtex-first-gate-audit
          path: artifacts/pt-webtex-first/webtex-first-gate-audit.json
          if-no-files-found: error
