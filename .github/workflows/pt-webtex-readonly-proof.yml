name: PT Webtex read-only login proof

on:
  workflow_dispatch:
    inputs:
      cohort_json:
        description: "Optional exact first50 SKU/collection cohort for stock-only proof"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PT_WEBTEX_USERNAME: ${{ secrets.PT_WEBTEX_USERNAME }}
      PT_WEBTEX_PASSWORD: ${{ secrets.PT_WEBTEX_PASSWORD }}
      PT_PROOF_COHORT_JSON: ${{ inputs.cohort_json }}
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Query one Webtex collection without database writes
        run: |
          if [ "$PT_PROOF_COHORT_JSON" = "__WEBTEX_FIRST_AUDIT__" ]; then
            npx --no-install tsx scripts/curtainsuk-pt-webtex-first-audit.ts
          elif [ "$PT_PROOF_COHORT_JSON" = "__WEBTEX_FIRST_RESOLVE_DISCONTINUED__" ]; then
            PT_WEBTEX_FIRST_APPLY=CONFIRM_DISCONTINUED_RECONCILIATION npx --no-install tsx scripts/curtainsuk-pt-webtex-first-resolve.ts
          elif [ -n "$PT_PROOF_COHORT_JSON" ]; then
            npx --no-install tsx scripts/curtainsuk-pt-stock-cohort-proof.ts
          else
            npx --no-install tsx scripts/curtainsuk-pt-stock-proof.ts
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.cohort_json == '__WEBTEX_FIRST_AUDIT__' || inputs.cohort_json == '__WEBTEX_FIRST_RESOLVE_DISCONTINUED__' }}
        with:
          name: pt-webtex-first-${{ inputs.cohort_json == '__WEBTEX_FIRST_AUDIT__' && 'gate-audit' || 'resolution-report' }}
          path: artifacts/pt-webtex-first/*.json
          if-no-files-found: error
