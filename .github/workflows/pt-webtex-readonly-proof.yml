name: PT Webtex read-only login proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PT_WEBTEX_USERNAME: ${{ secrets.PT_WEBTEX_USERNAME }}
      PT_WEBTEX_PASSWORD: ${{ secrets.PT_WEBTEX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Query one Webtex collection without database writes
        run: npx --no-install tsx scripts/curtainsuk-pt-stock-proof.ts
