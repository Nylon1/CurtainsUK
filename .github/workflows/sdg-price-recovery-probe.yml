name: SDG price recovery probe

on:
  push:
    branches:
      - "probe/sdg-price-recovery-20261002"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CURTAINSUK_SUPABASE_PROJECT_REF: hqysjumypgeapgmqkcrx
      SUPABASE_URL: ${{ secrets.SDG_STOCK_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SDG_STOCK_SUPABASE_SECRET_KEY }}
      SDG_TRADE_EMAIL: ${{ secrets.SDG_TRADE_EMAIL }}
      SDG_TRADE_PASSWORD: ${{ secrets.SDG_TRADE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx --no-install tsx scripts/curtainsuk-sdg-price-recovery-probe.ts
